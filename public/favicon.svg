<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="trGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#050714"/>
  <rect width="496" height="496" x="8" y="8" rx="120" stroke="url(#trGradient)" stroke-width="12" stroke-opacity="0.6"/>
  <text x="256" y="330" font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="240" fill="url(#trGradient)" text-anchor="middle" filter="url(#glow)" letter-spacing="-8">TR</text>
</svg>